<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Discord Web Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Adaptado a la altura dinámica real de móviles (100dvh) */
    html, body { 
      height: 100%; 
      height: 100dvh; 
      width: 100vw; 
      background-color: #313338; 
      color: #dbdee1; 
      overflow: hidden; 
    }

    body { display: flex; flex-direction: row; }

    /* Servidores */
    .servers { 
      width: 60px; 
      background-color: #1e1f22; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding-top: 10px; 
      gap: 8px; 
      flex-shrink: 0; 
    }
    .server-icon { 
      width: 42px; 
      height: 42px; 
      background-color: #5865f2; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: white; 
      font-weight: bold; 
      font-size: 0.9rem;
    }

    /* Canales */
    .channels { 
      width: 130px; 
      background-color: #2b2d31; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      flex-shrink: 0; 
    }
    .channels-header { 
      padding: 12px 8px; 
      font-weight: bold; 
      font-size: 0.9rem; 
      border-bottom: 1px solid #1f2023; 
      color: white; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .channel-list { padding: 6px 4px; list-style: none; overflow-y: auto; flex: 1; }
    .channel-item { 
      padding: 6px 8px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin-bottom: 2px; 
      color: #949ba4; 
      font-size: 0.85rem; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .channel-item.active { background-color: #35373c; color: white; }

    .user-profile { 
      padding: 8px; 
      background-color: #232428; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }
    .user-name { font-weight: bold; color: white; font-size: 0.75rem; max-width: 85px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .edit-user-btn { background: transparent; border: none; color: #b5bac1; cursor: pointer; font-size: 0.9rem; }

    /* Contenedor principal del Chat */
    .chat-container { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      background-color: #313338; 
      height: 100%; 
      min-width: 0; 
    }
    
    .chat-header { 
      height: 48px; 
      padding: 0 12px; 
      border-bottom: 1px solid #1f2023; 
      font-weight: bold; 
      color: white; 
      display: flex; 
      align-items: center; 
      flex-shrink: 0; 
      font-size: 0.95rem; 
    }
    
    /* Mensajes */
    .messages-box { 
      flex: 1; 
      padding: 12px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      scroll-behavior: smooth; 
    }
    .message { display: flex; flex-direction: column; word-break: break-word; }
    .message .author-line { display: flex; align-items: baseline; gap: 6px; }
    .message .author { font-weight: 600; color: #f2f3f5; font-size: 0.88rem; }
    .message .time { font-size: 0.7rem; color: #949ba4; }
    .message .text { color: #dbdee1; font-size: 0.85rem; margin-top: 2px; line-height: 1.25rem; white-space: pre-wrap; }
    
    /* ÁREA DEL INPUT SIEMPRE VISIBLE ABAJO */
    .chat-input-area { 
      padding: 8px; 
      background-color: #313338; 
      flex-shrink: 0; 
    }
    .chat-form { 
      display: flex; 
      background-color: #383a40; 
      border-radius: 8px; 
      padding: 6px 10px; 
      gap: 6px; 
      align-items: center; 
    }
    .chat-input { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: white; 
      outline: none; 
      font-size: 0.9rem; 
      min-width: 0; 
    }
    .chat-input::placeholder { color: #87899c; }
    .send-btn { 
      background-color: #5865f2; 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 0.8rem; 
      flex-shrink: 0; 
    }
    .send-btn:disabled { background-color: #4e5058; }
  </style>
</head>
<body>

  <!-- Servidores -->
  <aside class="servers">
    <div class="server-icon">DV</div>
  </aside>

  <!-- Canales -->
  <aside class="channels">
    <div>
      <div class="channels-header">DiscordVoult</div>
      <ul class="channel-list" id="channel-list">
        <li class="channel-item active" onclick="cambiarCanal('general', event)"># general</li>
        <li class="channel-item" onclick="cambiarCanal('desarrollo', event)"># desarrollo</li>
        <li class="channel-item" onclick="cambiarCanal('off-topic', event)"># off-topic</li>
      </ul>
    </div>
    
    <div class="user-profile">
      <span class="user-name" id="display-username">Cargando...</span>
      <button class="edit-user-btn" onclick="cambiarNombreUsuario()" title="Cambiar usuario">⚙️</button>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat-container">
    <div class="chat-header" id="current-channel-title"># general</div>
    
    <div class="messages-box" id="messages-box"></div>

    <div class="chat-input-area">
      <form class="chat-form" id="chat-form">
        <input type="text" id="message-input" class="chat-input" placeholder="Enviar mensaje..." required autocomplete="off">
        <button type="submit" id="btn-submit" class="send-btn">Enviar</button>
      </form>
    </div>
  </main>

  <script>
    const GITHUB_USER = 'CodeVoult';
    const REPO_NAME = 'DiscordVoult';
    const GITHUB_TOKEN = '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';
    
    let canalActual = 'general';

    function obtenerUsuario() {
      let usuario = localStorage.getItem('chat_username');
      if (!usuario) {
        usuario = prompt("Escribe tu nombre de usuario para el chat:") || "User_" + Math.floor(Math.random() * 1000);
        localStorage.setItem('chat_username', usuario);
      }
      document.getElementById('display-username').innerText = usuario;
      return usuario;
    }

    function cambiarNombreUsuario() {
      let nuevoNombre = prompt("Nuevo nombre de usuario:", localStorage.getItem('chat_username') || "");
      if (nuevoNombre && nuevoNombre.trim() !== "") {
        localStorage.setItem('chat_username', nuevoNombre.trim());
        document.getElementById('display-username').innerText = nuevoNombre.trim();
      }
    }

    function utf8_to_b64(str) { return window.btoa(unescape(encodeURIComponent(str))); }
    function b64_to_utf8(str) { return decodeURIComponent(escape(window.atob(str))); }

    async function cargarMensajes() {
      try {
        let res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/database.json?cache=${Date.now()}`, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!res.ok) return;

        let fileData = await res.json();
        let contentJson = JSON.parse(b64_to_utf8(fileData.content));
        
        let box = document.getElementById('messages-box');
        let isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 60;
        
        box.innerHTML = '';
        
        if (contentJson.channels && contentJson.channels[canalActual]) {
          contentJson.channels[canalActual].forEach(msg => {
            box.innerHTML += `
              <div class="message">
                <div class="author-line">
                  <span class="author">${escapeHtml(msg.user)}</span>
                  <span class="time">${msg.time || ''}</span>
                </div>
                <span class="text">${escapeHtml(msg.text)}</span>
              </div>
            `;
          });
          
          if (isAtBottom) {
            box.scrollTop = box.scrollHeight;
          }
        }
      } catch (e) {
        console.error("Error al cargar:", e);
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function cambiarCanal(canal, event) {
      canalActual = canal;
      document.getElementById('current-channel-title').innerText = '#' + canal;
      document.getElementById('message-input').placeholder = `Enviar a #${canal}...`;
      
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      
      cargarMensajes();
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let input = document.getElementById('message-input');
      let btn = document.getElementById('btn-submit');
      let texto = input.value.trim();
      if (!texto) return;

      let usuario = obtenerUsuario();
      btn.disabled = true;
      btn.innerText = "...";

      try {
        let getRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/database.json?cache=${Date.now()}`, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!getRes.ok) {
          alert("Error: Asegúrate de tener el archivo database.json en GitHub.");
          return;
        }

        let fileData = await getRes.json();
        let currentSha = fileData.sha;
        let dbData = JSON.parse(b64_to_utf8(fileData.content));

        if (!dbData.channels) dbData.channels = {};
        if (!dbData.channels[canalActual]) dbData.channels[canalActual] = [];

        let horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        dbData.channels[canalActual].push({
          user: usuario,
          text: texto,
          time: horaActual
        });

        let putRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/database.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: `💬 Mensaje de ${usuario}`,
            content: utf8_to_b64(JSON.stringify(dbData, null, 2)),
            sha: currentSha
          })
        });

        if (putRes.ok) {
          input.value = '';
          await cargarMensajes();
          let box = document.getElementById('messages-box');
          box.scrollTop = box.scrollHeight;
        } else {
          alert("Error al enviar. Intenta de nuevo.");
        }

      } catch (err) {
        console.error("Error al enviar:", err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar";
      }
    });

    obtenerUsuario();
    cargarMensajes();
    setInterval(cargarMensajes, 4000);
  </script>
</body>
</html>
