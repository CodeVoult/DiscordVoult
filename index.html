<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Web - GitHub DB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background-color: #313338; color: #dbdee1; overflow: hidden; }
    
    /* Servidores */
    .servers { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
    .server-icon { width: 48px; height: 48px; background-color: #5865f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .server-icon:hover { border-radius: 16px; background-color: #4752c4; }

    /* Canales */
    .channels { width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; justify-content: space-between; }
    .channels-header { padding: 16px; font-weight: bold; border-bottom: 1px solid #1f2023; color: white; display: flex; justify-content: space-between; align-items: center; }
    .channel-list { padding: 8px; list-style: none; overflow-y: auto; flex: 1; }
    .channel-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; color: #949ba4; transition: 0.15s; }
    .channel-item:hover, .channel-item.active { background-color: #35373c; color: white; }

    /* Perfil inferior en barra de canales */
    .user-profile { padding: 12px; background-color: #232428; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .user-info { display: flex; flex-direction: column; overflow: hidden; }
    .user-name { font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { color: #23a55a; font-size: 0.75rem; }
    .edit-user-btn { background: transparent; border: none; color: #b5bac1; cursor: pointer; font-size: 1rem; padding: 4px; }
    .edit-user-btn:hover { color: white; }

    /* Chat Area */
    .chat-container { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
    .chat-header { padding: 16px; border-bottom: 1px solid #1f2023; font-weight: bold; color: white; background-color: #313338; display: flex; align-items: center; gap: 8px; }
    
    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .message { display: flex; flex-direction: column; word-break: break-word; }
    .message .author-line { display: flex; align-items: baseline; gap: 8px; }
    .message .author { font-weight: 600; color: #f2f3f5; font-size: 0.95rem; }
    .message .time { font-size: 0.75rem; color: #949ba4; }
    .message .text { color: #dbdee1; font-size: 0.92rem; margin-top: 2px; line-height: 1.375rem; white-space: pre-wrap; }
    
    /* Input Area */
    .chat-input-area { padding: 0 16px 24px 16px; }
    .chat-form { display: flex; background-color: #383a40; border-radius: 8px; padding: 10px 16px; gap: 10px; align-items: center; }
    .chat-input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 0.95rem; }
    .chat-input::placeholder { color: #87899c; }
    .send-btn { background-color: #5865f2; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .send-btn:hover { background-color: #4752c4; }
    .send-btn:disabled { background-color: #4e5058; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- 1. Servidores -->
  <aside class="servers">
    <div class="server-icon" title="DiscordVoult Server">DV</div>
  </aside>

  <!-- 2. Canales y Perfil -->
  <aside class="channels">
    <div>
      <div class="channels-header">DiscordVoult</div>
      <ul class="channel-list" id="channel-list">
        <li class="channel-item active" onclick="cambiarCanal('general', event)"># general</li>
        <li class="channel-item" onclick="cambiarCanal('desarrollo', event)"># desarrollo</li>
        <li class="channel-item" onclick="cambiarCanal('off-topic', event)"># off-topic</li>
      </ul>
    </div>
    
    <!-- Tarjeta de usuario inferior -->
    <div class="user-profile">
      <div class="user-info">
        <span class="user-name" id="display-username">Cargando...</span>
        <span class="user-status">● En línea</span>
      </div>
      <button class="edit-user-btn" onclick="cambiarNombreUsuario()" title="Cambiar nombre de usuario">⚙️</button>
    </div>
  </aside>

  <!-- 3. Chat Principal -->
  <main class="chat-container">
    <div class="chat-header" id="current-channel-title"># general</div>
    
    <div class="messages-box" id="messages-box"></div>

    <div class="chat-input-area">
      <form class="chat-form" id="chat-form">
        <input type="text" id="message-input" class="chat-input" placeholder="Enviar mensaje a #general..." required autocomplete="off">
        <button type="submit" id="btn-submit" class="send-btn">Enviar</button>
      </form>
    </div>
  </main>

  <script>
    const GITHUB_USER = 'CodeVoult';
    const REPO_NAME = 'DiscordVoult';
    const GITHUB_TOKEN = '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';
    
    let canalActual = 'general';

    // Manejo de nombre de usuario local
    function obtenerUsuario() {
      let usuario = localStorage.getItem('chat_username');
      if (!usuario) {
        usuario = prompt("Elige tu nombre de usuario para el chat:") || "Invitado_" + Math.floor(Math.random() * 1000);
        localStorage.setItem('chat_username', usuario);
      }
      document.getElementById('display-username').innerText = usuario;
      return usuario;
    }

    function cambiarNombreUsuario() {
      let nuevoNombre = prompt("Nuevo nombre de usuario:", localStorage.getItem('chat_username') || "");
      if (nuevoNombre && nuevoNombre.trim() !== "") {
        localStorage.setItem('chat_username', nuevoNombre.trim());
        document.getElementById('display-username').innerText = nuevoNombre.trim();
      }
    }

    // Funciones Base64 compatibles con UTF-8
    function utf8_to_b64(str) {
      return window.btoa(unescape(encodeURIComponent(str)));
    }
    function b64_to_utf8(str) {
      return decodeURIComponent(escape(window.atob(str)));
    }

    // Cargar mensajes de GitHub
    async function cargarMensajes() {
      try {
        let res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/database.json?cache=${Date.now()}`, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!res.ok) return;

        let fileData = await res.json();
        let contentJson = JSON.parse(b64_to_utf8(fileData.content));
        
        let box = document.getElementById('messages-box');
        let isAtBottom = box.scrollHeight - box.scrollTop <= box.clientHeight + 80;
        
        box.innerHTML = '';
        
        if (contentJson.channels && contentJson.channels[canalActual]) {
          contentJson.channels[canalActual].forEach(msg => {
            box.innerHTML += `
              <div class="message">
                <div class="author-line">
                  <span class="author">${escapeHtml(msg.user)}</span>
                  <span class="time">${msg.time || ''}</span>
                </div>
                <span class="text">${escapeHtml(msg.text)}</span>
              </div>
            `;
          });
          
          if (isAtBottom) {
            box.scrollTop = box.scrollHeight;
          }
        }
      } catch (e) {
        console.error("Error al sincronizar con GitHub:", e);
      }
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function cambiarCanal(canal, event) {
      canalActual = canal;
      document.getElementById('current-channel-title').innerText = '#' + canal;
      document.getElementById('message-input').placeholder = `Enviar mensaje a #${canal}...`;
      
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (event && event.target) {
        event.target.classList.add('active');
      }
      
      cargarMensajes();
    }

    // Enviar mensaje
    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let input = document.getElementById('message-input');
      let btn = document.getElementById('btn-submit');
      let texto = input.value.trim();
      if (!texto) return;

      let usuario = obtenerUsuario();
      btn.disabled = true;
      btn.innerText = "Enviando...";

      try {
        // 1. Obtener el archivo actual y su SHA
        let getRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/database.json?cache=${Date.now()}`, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!getRes.ok) {
          alert("Error: No se encontró el archivo database.json en el repositorio.");
          return;
        }

        let fileData = await getRes.json();
        let currentSha = fileData.sha;
        let dbData = JSON.parse(b64_to_utf8(fileData.content));

        // 2. Modificar datos
        if (!dbData.channels) dbData.channels = {};
        if (!dbData.channels[canalActual]) dbData.channels[canalActual] = [];

        let horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        dbData.channels[canalActual].push({
          user: usuario,
          text: texto,
          time: horaActual
        });

        // 3. Enviar a GitHub mediante PUT
        let putRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/database.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: `💬 [${canalActual}] Mensaje de ${usuario}`,
            content: utf8_to_b64(JSON.stringify(dbData, null, 2)),
            sha: currentSha
          })
        });

        if (putRes.ok) {
          input.value = '';
          await cargarMensajes();
          let box = document.getElementById('messages-box');
          box.scrollTop = box.scrollHeight;
        } else {
          let errorData = await putRes.json();
          alert("Error de GitHub: " + (errorData.message || "No se pudo guardar."));
        }

      } catch (err) {
        console.error("Error al enviar mensaje:", err);
        alert("Ocurrió un error en la conexión.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar";
      }
    });

    // Inicializar aplicación
    obtenerUsuario();
    cargarMensajes();
    setInterval(cargarMensajes, 4000);
  </script>
</body>
</html>
